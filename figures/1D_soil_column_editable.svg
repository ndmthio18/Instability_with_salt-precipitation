<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1150 1500" width="1150" height="1500" role="img" aria-labelledby="figureTitle figureDesc">
<title id="figureTitle">One-dimensional soil-column model and boundary conditions</title>
<desc id="figureDesc">Editable vector schematic of a 0.20 meter high and 1 millimeter wide soil column, vertically graded into 80 cells, exposed to stagnant atmosphere at relative humidity 0.40, evaporating water at the top, monitoring the time-varying top salt flux, and supplied with saline solution from a Dirichlet reservoir at the bottom. Sides are no-flow boundaries. No solid salt layer is drawn.</desc>
<defs>
<marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5.5 L0 11 Z" fill="#2672AE"/></marker>
<marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5.5 L0 11 Z" fill="#0C8778"/></marker>
<marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#26313E"/></marker>
<marker id="dim-start" markerWidth="7" markerHeight="7" refX="0" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M7 0 L0 3.5 L7 7 Z" fill="#26313E"/></marker>
<marker id="dim-end" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#26313E"/></marker>
<clipPath id="soil-clip"><rect x="413" y="349" width="336" height="822"/></clipPath>
</defs><g id="canvas-and-typography" font-family="Arial, Helvetica, sans-serif" letter-spacing="0"><rect x="0" y="0" width="1150" height="1500" fill="#FFFFFF"/>
