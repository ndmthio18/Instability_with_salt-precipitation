<text x="577" y="216" text-anchor="middle" fill="#526171" font-size="25" font-weight="400" font-style="normal" >RH = 0.40</text>
<path d="M 568 334 L 568 252" fill="none" stroke="#2672AE" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
